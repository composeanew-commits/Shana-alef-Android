name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp -f manifest.webmanifest www/ 2>/dev/null || true
          cp -f *.png *.svg *.ico www/ 2>/dev/null || true
          cp -f sw.js service-worker.js www/ 2>/dev/null || true
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TalmidTracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
